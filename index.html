<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MIX STUDIO</title><style>
*{box-sizing:border-box}body{background:#121117;color:#eee;font:15px system-ui,sans-serif;margin:0}main{max-width:1000px;margin:auto;padding:32px}header{display:flex;align-items:center;justify-content:space-between}h1{letter-spacing:.15em;margin:0;color:#ff92c2}small,p{color:#aaa4b1}section{background:#201e28;border:1px solid #37313e;border-radius:14px;padding:20px;margin:18px 0}h2{font-size:16px;margin-top:0}label{display:block;margin:12px 0}input,select,button{font:inherit}input[type=file]{width:100%;color:#ddd}input[type=range]{width:100%;accent-color:#ec78ae}button,select{background:#35303e;color:white;border:1px solid #514459;padding:10px 16px;border-radius:8px}button{cursor:pointer}button.primary{background:#e982b4;color:#211520;font-weight:bold}button:disabled{opacity:.4;cursor:default}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.track{background:#17151e;padding:14px;border-radius:8px}canvas{width:100%;height:80px;background:#14131a;border-radius:5px}audio{width:100%}.actions{display:flex;flex-wrap:wrap;gap:10px}output{float:right;color:#ff9ec9}#status{white-space:pre-wrap}a{color:#ff92c2}</style><main><header><div><h1>MIX STUDIO</h1><small>PERSONAL VOCAL MIXING STUDIO / PRIVATE</small></div><a href="/logout">ログアウト</a></header><section><h2>01 / 音源を読み込む</h2><div class="grid"><div class="track"><label>カラオケ・伴奏<input id="inst" type="file" accept="audio/*,.wav,.mp3,.m4a,.flac"></label><canvas id="iw"></canvas><small id="ii">未選択</small></div><div class="track"><label>ボーカル<input id="voc" type="file" accept="audio/*,.wav,.mp3,.m4a,.flac"></label><canvas id="vw"></canvas><small id="vi">未選択</small></div></div><p>音源はブラウザ内で処理します。録音と伴奏は同じ開始位置で用意してください。</p></section><section><h2>02 / MIX設定</h2><label>プリセット <select id="preset"><option value="natural">Natural / 自然</option><option value="studio">Studio / クリア</option><option value="power">Powerful / 力強い</option></select></label><div class="grid" id="controls"></div><div class="actions"><button id="mix" class="primary" disabled>自動MIX開始</button><button id="dry" disabled>MIX前を作成</button><button id="save" disabled>WAV保存</button></div><p id="status" role="status">音源を2つ選択してください。</p></section><section><h2>03 / 試聴</h2><label>MIX前<audio id="before" controls></audio></label><label>MIX後<audio id="after" controls></audio></label><small>音程補正・AI分離・ハモリ生成は未搭載です。</small></section></main><script>
const $=id=>document.getElementById(id); const defs=[['vg','ボーカル音量',-18,12,0,1,'dB'],['ig','伴奏音量',-24,6,-3,1,'dB'],['hp','低域カット',40,180,85,5,'Hz'],['eq','明瞭感',-6,8,2,0.5,'dB'],['comp','圧縮の強さ',1,8,3,0.5,''],['rev','リバーブ',0,40,12,1,'%'],['offset','ボーカル位置',-2000,2000,0,10,'ms']];for(const [id,name,min,max,val,step,unit] of defs){let l=document.createElement('label');l.textContent=name;let o=document.createElement('output');o.id=id+'o';let r=document.createElement('input');Object.assign(r,{type:'range',id,min,max,value:val,step});r.oninput=()=>o.textContent=r.value+' '+unit;r.oninput();l.append(o,r);$('controls').append(l)}const value=id=>Number($(id).value);$('preset').onchange=()=>{let a={natural:[0,-3,85,2,3,12],studio:[1,-4,100,4,4,8],power:[2,-5,90,3,6,10]}[$('preset').value];defs.slice(0,6).forEach(([id],i)=>{$(id).value=a[i];$(id).oninput()})};let buffers={},ctx,output,busy=false;const urls={};function setAudio(id,blob){if(urls[id])URL.revokeObjectURL(urls[id]);urls[id]=URL.createObjectURL(blob);$(id).src=urls[id]}function ready(){$('mix').disabled=$('dry').disabled=busy||!buffers.inst||!buffers.voc;$('save').disabled=busy||!output}function waveform(b,id){let c=$(id),w=c.width=600,h=c.height=120,g=c.getContext('2d'),d=b.getChannelData(0);g.clearRect(0,0,w,h);g.fillStyle='#e982b4';for(let x=0;x<w;x++){let m=0;for(let k=Math.floor(x*d.length/w);k<Math.floor((x+1)*d.length/w);k+=Math.max(1,Math.floor(d.length/w/80)))m=Math.max(m,Math.abs(d[k]));g.fillRect(x,h/2-m*h/2,1,Math.max(1,m*h))}}for(let [id,can,info] of [['inst','iw','ii'],['voc','vw','vi']])$(id).onchange=async()=>{delete buffers[id];output=null;ready();let f=$(id).files[0];if(!f)return;busy=true;ready();try{ctx??=new AudioContext();let b=await ctx.decodeAudioData(await f.arrayBuffer());buffers[id]=b;waveform(b,can);$(info).textContent=f.name+' / '+b.duration.toFixed(1)+' 秒';$('status').textContent='読み込み完了';}catch(e){$('status').textContent='読み込み失敗: '+e.message}finally{busy=false;ready()}};
function rms(b){let s=0,n=0;for(let c=0;c<b.numberOfChannels;c++){let d=b.getChannelData(c);for(let i=0;i<d.length;i+=8){s+=d[i]*d[i];n++}}return Math.sqrt(s/Math.max(1,n))}const db=x=>10**(x/20);function gain(c,v){let n=c.createGain();n.gain.value=v;return n}function wav(b){let n=b.length,ch=b.numberOfChannels,ab=new ArrayBuffer(44+n*ch*2),v=new DataView(ab);let str=(p,s)=>{for(let i=0;i<s.length;i++)v.setUint8(p+i,s.charCodeAt(i))};str(0,'RIFF');v.setUint32(4,ab.byteLength-8,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);v.setUint32(24,b.sampleRate,true);v.setUint32(28,b.sampleRate*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,n*ch*2,true);let ds=Array.from({length:ch},(_,i)=>b.getChannelData(i));for(let i=0,p=44;i<n;i++)for(let c=0;c<ch;c++,p+=2)v.setInt16(p,Math.max(-1,Math.min(1,ds[c][i]))*32767,true);return new Blob([ab],{type:'audio/wav'})}
async function render(dry){if(busy)return;busy=true;ready();$('status').textContent='処理中…';try{await new Promise(r=>setTimeout(r,30));let rate=44100,off=value('offset')/1000, length=Math.ceil((Math.max(buffers.inst.duration,buffers.voc.duration+off)+ (dry?0:1.5))*rate),c=new OfflineAudioContext(2,length,rate);let bus=gain(c,1);bus.connect(c.destination);let i=c.createBufferSource(),v=c.createBufferSource();i.buffer=buffers.inst;v.buffer=buffers.voc;let ig=gain(c,dry?0.5:Math.min(4,0.12/Math.max(.001,rms(i.buffer)))*db(value('ig'))),vg=gain(c,dry?0.5:Math.min(6,0.15/Math.max(.001,rms(v.buffer)))*db(value('vg')));i.connect(ig).connect(bus);if(dry)v.connect(vg).connect(bus);else{let hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=value('hp');let eq=c.createBiquadFilter();eq.type='peaking';eq.frequency.value=3200;eq.Q.value=.8;eq.gain.value=value('eq');let comp=c.createDynamicsCompressor();comp.threshold.value=-24;comp.ratio.value=value('comp');comp.attack.value=.008;comp.release.value=.15;v.connect(hp).connect(eq).connect(comp).connect(vg).connect(bus);let re=c.createConvolver(),imp=c.createBuffer(2,rate*1.3,rate);for(let k=0;k<2;k++){let d=imp.getChannelData(k);for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*(1-j/d.length)**3}re.buffer=imp;vg.connect(re).connect(gain(c,value('rev')/100)).connect(bus)}i.start();if(off<0){if(-off<v.buffer.duration)v.start(0,-off)}else v.start(off);let b=await c.startRendering();let peak=0;for(let k=0;k<2;k++){let d=b.getChannelData(k);for(let j=0;j<d.length;j++)peak=Math.max(peak,Math.abs(d[j]))}let scale=peak>0?(dry?Math.min(1,.98/peak):.89/peak):1;for(let k=0;k<2;k++){let d=b.getChannelData(k);for(let j=0;j<d.length;j++)d[j]*=scale}let blob=wav(b);setAudio(dry?'before':'after',blob);if(!dry)output=blob;$('status').textContent=dry?'MIX前の試聴を作成しました。':'MIX完了。試聴またはWAV保存が可能です。'}catch(e){$('status').textContent='処理失敗: '+e.message}finally{busy=false;ready()}}$('mix').onclick=()=>render(false);$('dry').onclick=()=>render(true);$('save').onclick=()=>{if(!output)return;let a=document.createElement('a');a.href=URL.createObjectURL(output);a.download='mix-studio.wav';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000)};
</script></html>
